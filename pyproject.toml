[build-system]
requires = ["setuptools>=76.1.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codefence"
version = "1.0.12"
description = "A tiny offline policy gate for code. Check AI-generated code before it reaches Git."
dynamic = ["readme"]
requires-python = ">=3.10"
license = {file = "LICENSE.txt"}
authors = [
    {name = "CodeFence"},
]
keywords = [
    "security", "static-analysis", "pre-commit", "git-hook",
    "ai-generated-code", "sast", "sarif", "offline", "policy",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: Security",
]

[project.urls]
Source = "https://github.com/codefence-dev/codefence"
Issues = "https://github.com/codefence-dev/codefence/issues"
Changelog = "https://github.com/codefence-dev/codefence/blob/main/CHANGELOG.md"

[project.scripts]
cfence = "codefence:main"
codefence = "codefence:main"

[tool.setuptools]
py-modules = ["codefence"]

[tool.setuptools.data-files]
"." = [
    "rules.json",
    "README.md",
    "LICENSE.txt",
    "LICENSE_FAQ.md",
    "TERMS_OF_USE.md",
    "REFUND_POLICY.md",
    "SECURITY.md",
    "NOTICE.md",
    "CHANGELOG.md",
]
"share/codefence/samples" = [
    "samples/bad_python.py",
    "samples/bad_javascript.js",
    "samples/clean_example.py",
    "samples/clean_example.js",
]
"share/doc/codefence" = [
    "docs/DETECTION_METHODOLOGY.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.dynamic]
readme = {file = ["README.md"], content-type = "text/markdown"}
